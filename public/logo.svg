<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC9DE"/>
      <stop offset="1" stop-color="#F5A8CB"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3FF"/>
      <stop offset="1" stop-color="#EFE6FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#FFD873">
    <path d="M110 120 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z"/>
    <path d="M400 150 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M420 340 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 z"/>
  </g>

  <!-- pencil bookmark -->
  <g transform="translate(288 70) rotate(18)">
    <rect x="-10" y="0" width="20" height="90" rx="6" fill="#B6E3FF"/>
    <path d="M-10 0 L10 0 L0 -26 Z" fill="#FFE29A"/>
    <rect x="-10" y="0" width="20" height="10" fill="#8FD4FF"/>
  </g>

  <!-- notebook body -->
  <rect x="130" y="150" width="252" height="300" rx="28" fill="url(#cover)" stroke="#E88AB8" stroke-width="6"/>
  <!-- spine highlight -->
  <rect x="130" y="150" width="26" height="300" rx="13" fill="#FFE1EF"/>
  <!-- page edge -->
  <rect x="366" y="164" width="16" height="272" rx="8" fill="#FFF7FA"/>

  <!-- face -->
  <g>
    <!-- blush -->
    <ellipse cx="205" cy="315" rx="16" ry="10" fill="#FF9FC2" opacity="0.7"/>
    <ellipse cx="309" cy="315" rx="16" ry="10" fill="#FF9FC2" opacity="0.7"/>

    <!-- happy closed eyes ^ ^ -->
    <path d="M188 280 q14 -18 28 0" fill="none" stroke="#7A3B57" stroke-width="7" stroke-linecap="round"/>
    <path d="M296 280 q14 -18 28 0" fill="none" stroke="#7A3B57" stroke-width="7" stroke-linecap="round"/>

    <!-- smile -->
    <path d="M240 320 q16 16 32 0" fill="none" stroke="#7A3B57" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- little heart on cover -->
  <path d="M256 375 c-14 -14 -34 -4 -34 14 0 16 20 26 34 38 14 -12 34 -22 34 -38 0 -18 -20 -28 -34 -14z" fill="#FFFFFF" opacity="0.85"/>
</svg>
